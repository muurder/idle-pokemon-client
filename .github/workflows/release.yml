name: Build & Release

# Dispara em todo push na master: sobe codigo -> builda -> publica Release
# sozinho, sem precisar de tag manual. A versao e calculada automaticamente
# (major.minor do package.json + numero sequencial do run), entao cada push
# sempre gera uma versao maior que a anterior -- e o que o electron-updater
# usa pra saber que tem atualizacao nova.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}   # tambem da pra disparar na mao pela aba Actions

permissions:
  contents: write   # electron-builder precisa disso pra criar o Release

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão automática (major.minor + numero do run)
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm pkg set version="$BASE.${{ github.run_number }}"
          echo "Versao deste build: $(node -p "require('./package.json').version")"

      - name: Rebuild dos bundles (shell + css + userscript)
        run: |
          python shell/build_shell.py
          python css/build_css.py
          python scripts/build.py

      - name: Empacotar e publicar Release no GitHub
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: false
